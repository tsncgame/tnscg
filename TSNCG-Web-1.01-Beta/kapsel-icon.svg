<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="capGold" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="45%" stop-color="#f7c948"/>
      <stop offset="100%" stop-color="#c9932a"/>
    </radialGradient>
  </defs>

  <!-- crimped edge (bottle cap teeth) -->
  <g fill="#b9832a">
    <circle cx="32" cy="32" r="30"/>
  </g>
  <g fill="#e0ac3a">
    <!-- 20 teeth around the rim -->
    <path d="M32 2 L34.8 8.4 L29.2 8.4 Z" transform="rotate(0 32 32)"/>
  </g>

  <!-- simpler robust approach: outer scalloped ring built from circles -->
  <g fill="#d9a233">
    <circle cx="32" cy="4"  r="4.6"/>
    <circle cx="46" cy="8"  r="4.6"/>
    <circle cx="56" cy="18" r="4.6"/>
    <circle cx="60" cy="32" r="4.6"/>
    <circle cx="56" cy="46" r="4.6"/>
    <circle cx="46" cy="56" r="4.6"/>
    <circle cx="32" cy="60" r="4.6"/>
    <circle cx="18" cy="56" r="4.6"/>
    <circle cx="8"  cy="46" r="4.6"/>
    <circle cx="4"  cy="32" r="4.6"/>
    <circle cx="8"  cy="18" r="4.6"/>
    <circle cx="18" cy="8"  r="4.6"/>
  </g>

  <!-- main cap face -->
  <circle cx="32" cy="32" r="24" fill="url(#capGold)" stroke="#a97a24" stroke-width="1.5"/>

  <!-- crown-cork ridges -->
  <g stroke="#c9932a" stroke-width="1.4" opacity="0.6">
    <line x1="32" y1="10" x2="32" y2="54"/>
    <line x1="14" y1="32" x2="50" y2="32"/>
    <line x1="18" y1="18" x2="46" y2="46"/>
    <line x1="46" y1="18" x2="18" y2="46"/>
  </g>

  <!-- highlight -->
  <ellipse cx="24" cy="22" rx="7" ry="4" fill="#fffdf0" opacity="0.55"/>

  <!-- crown in the center -->
  <g transform="translate(32,33)">
    <path d="M-11,4
             L-11,-3
             L-6.5,1.5
             L-3.5,-7
             L0,1
             L3.5,-7
             L6.5,1.5
             L11,-3
             L11,4
             Z"
          fill="#7a4a12" stroke="#5c3609" stroke-width="1"/>
    <rect x="-11" y="4" width="22" height="3.4" rx="1" fill="#5c3609" stroke="#452a06" stroke-width="0.8"/>
    <circle cx="-3.5" cy="-7" r="1.6" fill="#fff3c4"/>
    <circle cx="0" cy="1" r="1.9" fill="#fff3c4"/>
    <circle cx="3.5" cy="-7" r="1.6" fill="#fff3c4"/>
  </g>
</svg>
